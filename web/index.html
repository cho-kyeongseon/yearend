<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>연말정산 도우미</title>
  <meta name="description" content="국세청 2025년 귀속 연말정산 안내 자료를 근거로 공제 여부를 안내합니다.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧾</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <header>
      <h1>🧾 연말정산 도우미</h1>
      <p class="caption">국세청 2025년 귀속 연말정산 안내 자료를 근거로 합니다. 일반적인 안내이며 세무 자문이 아닙니다.
        최종 판단은 회사 담당자나 국세상담센터(☎126)에 확인하세요.</p>
    </header>

    <nav class="tabs" role="tablist">
      <button role="tab" class="tab active" data-tab="chat">💬 상담하기</button>
      <button role="tab" class="tab" data-tab="check">✅ 공제 체크리스트</button>
      <button role="tab" class="tab" data-tab="search">🔎 자료 검색</button>
    </nav>

    <div id="loading" class="loading">자료를 불러오는 중이에요…</div>

    <!-- 상담하기 -->
    <section id="panel-chat" class="panel active" hidden>
      <div id="room" class="kk-room"></div>
      <div id="qr" class="qr"></div>
      <form id="chat-form" class="chat-form" autocomplete="off">
        <input id="chat-input" type="text" placeholder="메시지를 입력하세요" aria-label="메시지">
        <button type="submit" class="send">전송</button>
      </form>
      <button id="chat-reset" class="ghost">🗑 대화 새로 시작</button>
    </section>

    <!-- 공제 체크리스트 -->
    <section id="panel-check" class="panel" hidden>
      <div class="legend">범례 : <span><i class="dot inc"></i>소득공제항목</span><span><i class="dot tax"></i>세액공제항목</span></div>
      <div id="groups" class="groups"></div>
      <p class="muted">질문이 많은 항목 위주로 만들었으며, 모든 공제 항목을 다루지는 않습니다.</p>
      <hr>
      <div id="flow"><div class="info">위에서 확인하고 싶은 항목을 눌러 보세요. 질문에 '네/아니오'로 답하면 공제 가능 여부를 알려 드립니다.</div></div>
    </section>

    <!-- 자료 검색 -->
    <section id="panel-search" class="panel" hidden>
      <p class="muted">체크리스트에 없는 내용은 여기서 자료 원문을 찾아보세요. 짧은 핵심 단어로 찾을수록 정확합니다.</p>
      <div id="examples" class="examples"></div>
      <form id="search-form" class="search-form" autocomplete="off">
        <input id="search-input" type="search" placeholder="예) 교육비 대학원, 부양가족 중복공제" aria-label="검색어">
        <button type="submit">검색</button>
      </form>
      <div id="results"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
